name: Published version claims

# The offline half of this guard already runs on every pull request, inside
# `npm test` (tests/publishedVersionClaims.test.js), so no extra PR job and no
# extra PR minutes. Only the half that needs the network — comparing what the
# site advertises against what PyPI actually publishes — runs here, once a day.
# A release is what makes these claims go stale, and releases land on their own
# schedule, not on ours.

on:
  schedule:
    # 13:20 UTC daily. Off the hour so it does not queue behind the crowd.
    - cron: '20 13 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/published-version-claims.json'
      - 'scripts/check_published_version_claims.mjs'
      - 'public/status.json'
      - '.github/workflows/published-version-claims.yml'

permissions:
  contents: read

concurrency:
  group: published-version-claims-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Standard library only: no npm install, no lockfile, no cache.
      - name: Compare published version claims against PyPI
        run: node scripts/check_published_version_claims.mjs
