<html>
<head>
  <meta name="robots" content="noindex, nofollow" />
  <title>OpenAdapt form definitions</title>
</head>
<body hidden aria-hidden="true">
<!-- A little help for the Netlify post-processing bots -->
<form name="email" data-netlify="true" method="POST" netlify netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="email" />
  <input type="text" name="bot-field" />
  <input type="email" name="email" />
  <button type="submit">Register</button>
</form>

<form name="contact" data-netlify="true" method="POST" netlify netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="contact" />
  <input type="text" name="bot-field" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="text" name="company" />
  <input type="text" name="role" />
  <input type="text" name="workflows" />
  <textarea name="message"></textarea>
  <button type="submit">Contact</button>
</form>

<form name="workflow-qualification" data-netlify="true" method="POST" netlify netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="workflow-qualification" />
  <input type="text" name="bot-field" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="text" name="company" />
  <input type="text" name="role" />
  <input type="text" name="application" />
  <input type="text" name="applicationVersion" />
  <input type="text" name="environment" />
  <textarea name="workflow"></textarea>
  <input type="text" name="monthlyVolume" />
  <input type="text" name="manualTime" />
  <input type="text" name="operators" />
  <input type="text" name="errorConsequence" />
  <input type="text" name="inputStructure" />
  <input type="text" name="stability" />
  <input type="text" name="writeApi" />
  <input type="text" name="verifier" />
  <input type="text" name="testEnvironment" />
  <input type="text" name="dataSensitivity" />
  <textarea name="deploymentRestrictions"></textarea>
  <input type="text" name="economicBuyer" />
  <input type="text" name="buyerAuthority" />
  <input type="text" name="timeline" />
  <input type="text" name="budget" />
  <input type="text" name="reusePotential" />
  <input type="text" name="leadSegment" />
  <input type="text" name="privacyConsent" />
  <input type="text" name="qualificationScore" />
  <input type="text" name="qualificationTier" />
  <input type="text" name="salesTaskSchema" />
  <input type="text" name="salesTaskId" />
  <input type="text" name="salesTaskStatus" />
  <input type="text" name="sourceRoute" />
  <input type="text" name="bookingState" />
  <input type="text" name="submittedAt" />
</form>

<form name="partner-inquiry" data-netlify="true" method="POST" netlify netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="partner-inquiry" />
  <input type="text" name="bot-field" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="text" name="company" />
  <input type="text" name="role" />
  <input type="text" name="track" />
  <input type="text" name="systems" />
  <textarea name="message"></textarea>
  <button type="submit">Apply to partner</button>
</form>

<form name="contributor-program" data-netlify="true" method="POST" netlify netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="contributor-program" />
  <input type="text" name="bot-field" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="text" name="company" />
  <input type="text" name="role" />
  <input type="text" name="workflows" />
  <textarea name="message"></textarea>
  <button type="submit">Request access</button>
</form>

<form name="dental-founding-cohort" data-netlify="true" method="POST" netlify netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="dental-founding-cohort" />
  <input type="text" name="bot-field" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="text" name="practice" />
  <input type="text" name="pms" />
  <textarea name="message"></textarea>
  <input type="hidden" name="landing_path" />
  <input type="hidden" name="utm_source" />
  <input type="hidden" name="utm_medium" />
  <input type="hidden" name="utm_campaign" />
  <input type="hidden" name="utm_term" />
  <input type="hidden" name="utm_content" />
  <button type="submit">Request details</button>
</form>
</body>
</html>
